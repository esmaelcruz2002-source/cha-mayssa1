<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chá Cozinha Mayssa</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* --- TEMA MARROM TERRA / CHOCOLATE --- */
        :root { --cor-principal: #6d4c41; --cor-fundo: #faf7f2; --cor-texto: #4a4a4a; --cor-destaque: #a1887f; --cor-botao-verde: #5cb85c; --cor-borda: #d7ccc8; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--cor-fundo); color: var(--cor-texto); margin: 0; padding: 0; line-height: 1.6; }
        
        /* CABEÇALHO */
        header { 
            background-color: var(--cor-principal); 
            color: white; 
            text-align: center; 
            padding: 100px 20px; 
            background-image: 
                linear-gradient(to bottom, rgba(109, 76, 65, 0.85), rgba(109, 76, 65, 0.7)), 
                url('biblia.jpeg'), 
                url('biblia.jpg'), 
                url('biblia.png'), 
                url('biblia.webp'); 
            background-size: cover; 
            background-position: center; 
            position: relative; 
            z-index: 1; 
        }

        @media print { header, .btn-voltar, .submit-btn, .nav-btn, h2, .versiculo-final, .warning-box, .welcome-text { display: none !important; } body { background: white; } .container { box-shadow: none; border: none; margin: 0; padding: 0; min-height: auto; } #thank-you-card { border: 2px solid #000; break-inside: avoid; } }

        h1 { font-family: 'Playfair Display', serif; font-size: 3.5em; margin: 0; font-weight: 700; letter-spacing: 1px; text-shadow: 2px 2px 15px rgba(0,0,0,0.9); }
        .welcome-text { font-size: 1.25em; max-width: 800px; margin: 20px auto; font-weight: 400; text-shadow: 1px 1px 8px rgba(0,0,0,0.9); line-height: 1.8; }
        .versiculo { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.1em; background: rgba(255,255,255,0.15); padding: 20px; border-radius: 15px; margin-top: 30px; display: inline-block; border: 1px solid rgba(255,255,255,0.3); text-shadow: 1px 1px 5px rgba(0,0,0,0.8); max-width: 90%; }
        
        /* AJUSTE DA FOTO PARA CELULAR SEM CORTAR DETALHES */
        .couple-photo-container { margin-top: 35px; text-align: center; position: relative; z-index: 2; padding: 0 10px; }
        .couple-photo { max-width: 440px; width: 95%; height: auto; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); border: 4px solid rgba(255,255,255,0.9); object-fit: contain; background-color: #ddd; display: inline-block; }
        
        .container { max-width: 800px; margin: -50px auto 40px; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); position: relative; z-index: 10; min-height: 400px; }
        
        h2 { font-family: 'Comfortaa', cursive; color: var(--cor-principal); font-weight: 700; }
        .categoria-titulo { font-family: 'Playfair Display', serif; color: var(--cor-principal); font-size: 1.6em; margin-top: 50px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        
        input[type="text"] { font-family: 'Roboto', sans-serif; width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; box-sizing: border-box; margin-bottom: 20px; }
        input[type="text"]:focus { outline: none; border-color: var(--cor-principal); }
        
        .nav-btn { font-family: 'Comfortaa', cursive; display: block; width: 100%; padding: 20px; margin: 15px 0; background: white; border: 2px solid var(--cor-principal); color: var(--cor-principal); font-size: 1.1em; border-radius: 50px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .nav-btn:hover { background: var(--cor-principal); color: white; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .btn-voltar { background: transparent; border: 2px solid var(--cor-principal); color: var(--cor-principal); padding: 8px 25px; border-radius: 20px; cursor: pointer; font-family: 'Comfortaa'; font-size: 0.95em; display: inline-flex; align-items: center; margin-bottom: 25px; transition: 0.3s; font-weight: bold; position: relative; z-index: 20; }
        .btn-voltar:hover { background-color: var(--cor-principal); color: white; }
        
        .gift-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .gift-item { font-family: 'Roboto', sans-serif; padding: 15px; border: 1px solid #e0e0e0; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; background-color: white; }
        .gift-item:hover { background-color: #fcece6; border-color: var(--cor-principal); }
        .gift-item.selected { background-color: var(--cor-principal); color: white; transform: scale(1.03); border-color: var(--cor-principal); font-weight: bold; box-shadow: 0 5px 15px rgba(109, 76, 65, 0.3); }
        .gift-item.taken { background-color: #f5f5f5; color: #aaa; pointer-events: none; border-color: #eee; text-decoration: line-through; opacity: 0.7; }
        
        .submit-btn { font-family: 'Comfortaa', cursive; background-color: #27ae60; color: white; border: none; padding: 18px 40px; font-size: 1.2em; border-radius: 50px; cursor: pointer; margin-top: 30px; width: 100%; font-weight: bold; transition: 0.3s; }
        .submit-btn:hover { background-color: #219150; transform: translateY(-2px); }
